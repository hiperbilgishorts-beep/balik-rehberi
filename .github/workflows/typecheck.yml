name: TypeScript validation and standalone Android APK build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/seeds/**'
      - 'docs/**'
      - 'PRIVACY_POLICY.md'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://uilplrllepuyofmdxqox.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gjwXXDYDmveDLXtRLyg9Xg_8uPysPVO
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify real Supabase REST connection
        if: ${{ env.EXPO_PUBLIC_SUPABASE_URL != '' && (env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' || env.EXPO_PUBLIC_SUPABASE_ANON_KEY != '') }}
        run: npm run verify:supabase
      - name: Note missing Supabase CI variables
        if: ${{ env.EXPO_PUBLIC_SUPABASE_URL == '' || (env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY == '' && env.EXPO_PUBLIC_SUPABASE_ANON_KEY == '') }}
        run: echo "::warning::Supabase environment variables are missing; connection verification was skipped."
      - name: Type-check app
        run: npm run typecheck
      - name: Validate bundled Android JavaScript
        run: npx expo export --platform android
      - name: Set up Java for Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      # Build and upload the installable APK first, independently from the Play Store AAB.
      - name: Compile standalone Android release APK
        timeout-minutes: 25
        run: cd android && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Upload standalone Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: balik-rehberi-android-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile Android App Bundle
        timeout-minutes: 20
        run: cd android && ./gradlew --no-daemon --stacktrace bundleRelease
      - name: Upload Android App Bundle for Play Store preparation
        uses: actions/upload-artifact@v4
        with:
          name: balik-rehberi-android-app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
