name: balik-rehberi-android-standalone-apk

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "package.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/balik-rehberi-android-standalone-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Supabase configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (preferred) or EXPO_PUBLIC_SUPABASE_ANON_KEY in GitHub Actions secrets."
            exit 1
          fi

      - name: Check Supabase REST access
        run: npm run verify:supabase

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: balik-rehberi-android-standalone-apk
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30
